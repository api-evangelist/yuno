notes: >-
  First-party Yuno client libraries and agent tooling published under the
  @yuno-payments npm organization and the yuno-payments GitHub org. Yuno does
  not publish first-party server SDKs to PyPI, Maven Central, NuGet, RubyGems,
  Packagist or crates.io as of this pass (the PyPI package "yuno" is an
  unrelated third-party database library and is excluded). Mobile SDKs are
  distributed as native packages (CocoaPods / Gradle / pub.dev).
