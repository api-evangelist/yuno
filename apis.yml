aid: yuno
name: Yuno
description: >-
  Yuno is a global payment orchestration platform that lets merchants connect to
  1,000+ payment methods, PSPs, anti-fraud, and payout providers through a single
  API and SDK. Its unified checkout, smart routing, and no-code workflows
  consolidate a company's payment stack, reduce processing fees, and improve
  approval rates across markets. Yuno exposes payments, checkout sessions,
  customers, subscriptions, payouts, disputes, reports, banking connectivity, and
  a PCI Proxy, plus Web/iOS/Android/React Native/Flutter checkout SDKs, an
  official MCP server, and an agent toolkit for building agentic payment flows.
  Yuno is certified to PCI DSS v4.0, SOC 2 Type 2, ISO/IEC 27001, ISO/IEC 27701,
  GDPR, and is a recognized Visa Service Provider.
